name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------- API NestJS
  api:
    name: API · lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tongapass
          POSTGRES_PASSWORD: tongapass-ci
          POSTGRES_DB: tongapass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tongapass" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests unitaires (couverture)
        run: npm run test:cov
      - name: Tests de bout en bout (PostgreSQL réel)
        run: npm run test:e2e
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_USER: tongapass
          DATABASE_PASSWORD: tongapass-ci
          DATABASE_NAME: tongapass_test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          retention-days: 7

  # ---------------------------------------------------------------- Portail React
  portal:
    name: Portail · lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ---------------------------------------------------------------- Workflows n8n
  automation:
    name: Workflows n8n · génération à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Régénérer et vérifier les workflows (syntaxe JS + connexions)
        run: node automation/n8n/build-workflows.mjs
      - name: Les JSON versionnés correspondent au code source
        run: git diff --exit-code automation/n8n/workflows

  # ---------------------------------------------------------------- E2E navigateur
  e2e:
    name: Parcours utilisateur · Playwright
    needs: [api, portal]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tongapass
          POSTGRES_PASSWORD: tongapass-ci
          POSTGRES_DB: tongapass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tongapass" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_PORT: '5432'
      DATABASE_PASSWORD: tongapass-ci
      N8N_WEBHOOK_TOKEN: ci-webhook-token-0123456789abcdef
      AUTOMATION_HMAC_SECRET: ci-hmac-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --no-audit --no-fund
        working-directory: apps/api
      - run: npm ci --no-audit --no-fund
        working-directory: apps/portal
      - run: npm ci --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
        env:
          E2E_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------- DevSecOps
  secrets:
    name: Sécurité · secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Sécurité · dépendances et configuration (Trivy, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (API)
        run: npm audit --omit=dev --audit-level=high
        working-directory: apps/api
      - name: npm audit (portail)
        run: npm audit --omit=dev --audit-level=high
        working-directory: apps/portal
      - name: Trivy — vulnérabilités, secrets et mauvaises configurations (Dockerfile, Compose)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  images:
    name: Images Docker · build et scan
    needs: [api, portal]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, portal]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          load: true
          push: false
          tags: tongapass/${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Trivy — scan de l'image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: tongapass/${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
